['What is cybersecurity?','امنیت سایبری چیست؟',['Cybersecurity keeps systems, data and people safe from misuse. We judge it with three questions: can someone read what they should not, change what they should not, or stop us from using what we need? Zero risk does not exist, so the job is to manage risk.'],['امنیت سایبری یعنی محافظت از سیستم‌ها، داده‌ها و آدم‌ها در برابر سوءاستفاده. با سه پرسش سنجیده می‌شود: کسی می‌تواند چیزی را بخواند که نباید؟ چیزی را تغییر دهد که نباید؟ یا مانع استفاده‌ی ما از چیزی شود که لازم داریم؟ ریسک صفر وجود ندارد، پس کار ما مدیریت ریسک است.']],
['Who plays the game','بازیگران این میدان',['On one side are criminals, state actors and careless or angry insiders. On the other are red teams that simulate attacks, blue teams that defend, and a SOC that watches around the clock.'],['یک طرف مجرمان، بازیگران دولتی و افراد داخلی بی‌دقت یا ناراضی‌اند. طرف دیگر تیم قرمز است که حمله را شبیه‌سازی می‌کند، تیم آبی که دفاع می‌کند و SOC که شبانه‌روز نگاه می‌کند.']],
['AI on the attacker side','هوش مصنوعی در سمت مهاجم',['AI writes flawless phishing in any language, reads code and maps targets in minutes, and lets less skilled attackers do what once needed an expert.'],['هوش مصنوعی فیشینگ بی‌نقص به هر زبانی می‌نویسد، در چند دقیقه کد را می‌خواند و هدف را نقشه‌برداری می‌کند و کاری را که زمانی متخصص می‌خواست به مهاجم کم‌مهارت‌تر هم می‌سپارد.']],
['AI on the defender side','هوش مصنوعی در سمت مدافع',['The same technology summarises alerts, drafts detection rules and queries, and frees analysts to spend their time on judgment instead of routine.'],['همین فناوری هشدارها را خلاصه می‌کند، پیش‌نویس قوانین تشخیص و کوئری می‌نویسد و تحلیلگر را آزاد می‌کند که وقتش را صرف قضاوت کند، نه کار تکراری.']],
['New risks and the human role','ریسک‌های جدید و نقش انسان',['AI can be confidently wrong, and AI systems are targets too, through prompt injection and data leakage. So humans decide and AI accelerates.'],['هوش مصنوعی می‌تواند با اطمینان کامل اشتباه کند و خود سامانه‌های AI هم هدف‌اند، با تزریق پرامپت و نشت داده. پس انسان تصمیم می‌گیرد و AI شتاب می‌دهد.']]],
pentest:[['Pentest lifecycle and where AI helps','چرخه‌ی تست نفوذ و جایگاه AI',['A pentest moves from recon to fingerprinting, analysis, validation and report. AI speeds up analysis and writing, but authorization always comes from a written scope.'],['تست نفوذ از شناسایی به اثرانگشت‌گیری، تحلیل، تأیید و گزارش می‌رسد. AI تحلیل و نگارش را سریع می‌کند، اما مجوز همیشه از یک محدوده‌ی کتبی می‌آید.']],
['Watch the AI assistant work','دستیار هوشمند را در حال کار ببینید',['Watch the assistant work on a simulated target. Every step feeds the next, and it explains why, not just what.'],['دستیار را روی یک هدف شبیه‌سازی‌شده ببینید. هر مرحله ورودی مرحله‌ی بعد است و دستیار دلیل را هم می‌گوید، نه فقط کار را.']]],
red:[['AI-assisted adversary simulation','شبیه‌سازی مهاجم با کمک AI',['AI helps plan scenarios, map them to MITRE ATT&CK and draft safe lures for authorised exercises, while humans own scope, impact and ethics.'],['AI در طراحی سناریو، نگاشت به MITRE ATT&CK و نوشتن طعمه‌ی ایمن برای تمرین‌های مجاز کمک می‌کند، اما دامنه، اثر و اخلاق با انسان است.']]],
vuln:[['AI in bug bounty','هوش مصنوعی در باگ‌بانتی',['In bug bounty, AI helps prioritise scope, write triage notes, check duplicates and sharpen reports. Never submit unverified AI output, because noise costs you reputation.'],['در باگ‌بانتی AI به اولویت‌بندی محدوده، یادداشت تریاژ، بررسی تکراری‌بودن و بهتر شدن گزارش کمک می‌کند. خروجی تأییدنشده‌ی AI را هرگز نفرست، چون نویز اعتبارت را می‌برد.']],
['AI in code audit and research','هوش مصنوعی در ممیزی کد و تحقیق',['In code audit, AI spots risky patterns, suggests the CWE and a fix, and helps write fuzz harnesses and read patch diffs. It finds candidates; humans confirm exploitability.'],['در ممیزی کد، AI الگوهای پرخطر را نشان می‌دهد، CWE و اصلاح پیشنهاد می‌کند و به نوشتن harness فازینگ و خواندن diff وصله کمک می‌کند. کاندید پیدا می‌کند و قابلیت بهره‌برداری را انسان تأیید می‌کند.']]],
soc:[['AI in the SOC','هوش مصنوعی در SOC',['In the SOC, AI summarises alerts, adds context and drafts SPL from plain language. The risk is a confident wrong answer, so analysts stay in the loop.'],['در SOC هوش مصنوعی هشدار را خلاصه می‌کند، زمینه اضافه می‌کند و از زبان ساده SPL می‌نویسد. ریسک آن پاسخ اشتباه با اطمینان بالاست، پس تحلیلگر در حلقه می‌ماند.']]],
ti:[['AI in threat intelligence','هوش مصنوعی در اطلاعات تهدید',['Threat intelligence drowns in reports. AI reads and summarises them and pulls IOCs and TTPs into structured data, as long as the sources are verified.'],['اطلاعات تهدید زیر انبوه گزارش‌ها غرق است. AI آن‌ها را می‌خواند، خلاصه می‌کند و IOC و TTP را به داده‌ی ساختاریافته تبدیل می‌کند، به شرط راستی‌آزمایی منابع.']]],
dfir:[['AI in digital forensics','هوش مصنوعی در فارنزیک دیجیتال',['In forensics, AI correlates events into a timeline and explains suspicious artifacts, while evidence integrity stays a human responsibility.'],['در فارنزیک، AI رویدادها را در یک خط زمانی هم‌بسته می‌کند و artifactهای مشکوک را توضیح می‌دهد، اما صحت شواهد مسئولیت انسان می‌ماند.']]],
net:[['AI in network security','هوش مصنوعی در امنیت شبکه',['In network security, AI flags anomalies against a traffic baseline and reviews firewall rules and segmentation. Every change still needs human approval.'],['در امنیت شبکه، AI ناهنجاری را نسبت به خط پایه‌ی ترافیک نشان می‌دهد و قوانین فایروال و بخش‌بندی را بازبینی می‌کند. هر تغییر همچنان تأیید انسان می‌خواهد.']]],
end:[['Key takeaways','نکات کلیدی',['AI multiplies force on both sides. Validate everything, stay inside scope and ethics, and start small: pick one workflow and measure it.'],['AI نیروی هر دو طرف را چند برابر می‌کند. همه‌چیز را تأیید کن، در محدوده و اخلاق بمان و کوچک شروع کن: یک جریان کاری را انتخاب کن و اندازه بگیر.']],
['Questions and discussion','پرسش و پاسخ',['Now it is your turn. Will AI replace pentesters and analysts? How do we trust AI findings? Where should a beginner start? Or ask anything else.'],['حالا نوبت شماست. آیا AI جای پنتسترها و تحلیلگران را می‌گیرد؟ چطور به یافته‌های AI اعتماد کنیم؟ مبتدی از کجا شروع کند؟ یا هر چیز دیگری بپرسید.']]]};
